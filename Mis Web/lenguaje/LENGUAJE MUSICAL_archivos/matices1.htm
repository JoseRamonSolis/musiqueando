<p class=MsoBodyText style='text-indent:35.4pt'><span style='font-weight:normal'>Los
matices y reguladores son elementos que modifican la intensidad con que se debe
emitir los sonidos. Se pueden expresar con palabras en italiano, aunque
frecuentemente se usan abreviaturas, y con signos especiales.<o:p></o:p></span></p>
